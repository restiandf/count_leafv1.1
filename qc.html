<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTechLens - QC</title>
    <link rel="icon" href="btech.png" type="image/png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="btech.png" />
    <meta name="theme-color" content="#ff4757" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BTechLens" />
    <script src="ort/ort.min.js"></script>
    <style>
      :root {
        --primary: #ff4757;
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
      }
      body {
        font-family: sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        margin: 0;
      }
      .container {
        background: var(--card);
        padding: 1.5rem;
        border-radius: 20px;
        width: 100%;
        max-width: 700px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      h2 {
        margin-top: 0;
        color: #fff;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      #wrapper {
        position: relative;
        margin: 15px 0;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        line-height: 0;
        border: 2px solid #334155;
      }
      video,
      #imageDisplay {
        display: none;
      }
      .logo {
        display: block;
        width: 50px;
        height: 50px;
        object-fit: contain;
        flex-shrink: 0;
        border-radius: 50%;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
      }
      .btn-group {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }

      button,
      .upload-label {
        background: #fff;
        color: #000;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: all 0.2s;
      }
      button:hover,
      .upload-label:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      button:disabled {
        background: #475569;
        color: #94a3b8;
        cursor: not-allowed;
        transform: none;
      }

      .upload-label {
        background: #e2e8f0;
        display: inline-block;
      }
      #stopBtn {
        background: var(--primary);
        color: #fff;
      }

      .controls {
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 12px;
        margin-top: 10px;
      }
      .status-bar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 13px;
        opacity: 0.8;
        padding: 0 5px;
      }
      #count-badge {
        background: var(--primary);
        color: white;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: bold;
      }
      .legend {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        font-size: 12px;
        margin-bottom: 10px;
        opacity: 0.9;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend-dot {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .class-count {
        font-weight: bold;
      }
      .mode-switch {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-bottom: 16px;
        background: rgba(255, 255, 255, 0.05);
        padding: 6px;
        border-radius: 12px;
      }
      .mode-btn {
        flex: 1;
        padding: 10px 16px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
        color: #94a3b8;
        transition: all 0.2s;
      }
      .mode-btn:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
      .mode-btn.active {
        background: var(--primary);
        color: #fff;
      }
      .radio-group {
        display: flex;
        gap: 16px;
        justify-content: center;
        align-items: center;
        font-size: 13px;
      }
      .radio-group label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #save-panel {
        display: none;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 13px;
      }
      #save-panel .btn-group {
        margin-bottom: 0;
        margin-top: 10px;
      }
      #skipHistoryBtn {
        background: #475569;
        color: #fff;
      }
      .history-section {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        text-align: left;
      }
      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 13px;
      }
      #history-summary {
        font-size: 12px;
        margin-bottom: 10px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        line-height: 1.5;
      }
      #history-summary strong {
        color: #fff;
      }
      #resetHistoryBtn {
        background: transparent;
        color: #94a3b8;
        padding: 4px 10px;
        font-size: 12px;
        border: 1px solid #475569;
      }
      #resetHistoryBtn:hover {
        color: #fff;
        border-color: var(--primary);
      }
      #history-list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 180px;
        overflow-y: auto;
        font-size: 12px;
      }
      #history-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        margin-bottom: 6px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
      }
      .history-item-text {
        flex: 1;
        min-width: 0;
      }
      .history-delete-btn {
        background: transparent;
        color: #94a3b8;
        border: 1px solid #475569;
        padding: 4px 8px;
        font-size: 11px;
        border-radius: 6px;
        flex-shrink: 0;
      }
      .history-delete-btn:hover {
        color: #fff;
        border-color: var(--primary);
        background: rgba(255, 71, 87, 0.15);
      }
      #history-list .history-empty {
        opacity: 0.6;
        text-align: center;
        background: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>
        <img class="logo" src="btech.png" alt="BTechLens" />
        BTechLens
      </h2>

      <div class="mode-switch">
        <a href="index.html" class="mode-btn">Tutup Daun</a>
        <a href="wiper.html" class="mode-btn">Wiper</a>
        <a href="qc.html" class="mode-btn active">QC</a>
      </div>

      <div class="status-bar">
        <span id="status">⏳ Memuat Model v1.2...</span>
        <span>Total: <span id="count-badge">0</span></span>
      </div>

      <div class="legend" id="legend"></div>

      <div class="btn-group">
        <label class="upload-label">
          📷 Ambil Foto
          <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
            style="display: none"
          />
        </label>
        <label class="upload-label">
          📁 Pilih Gambar
          <input
            type="file"
            id="fileInput"
            accept="image/*"
            style="display: none"
          />
        </label>
        <button id="stopBtn" style="display: none">Stop</button>
      </div>

      <div id="wrapper">
        <img id="imageDisplay" />
        <canvas id="canvas"></canvas>
      </div>

      <div class="controls">
        <div class="radio-group">
          Tampilkan nomor:
          <label>
            <input type="radio" name="showNumbers" value="on" checked />
            Ya
          </label>
          <label>
            <input type="radio" name="showNumbers" value="off" />
            Tidak
          </label>
        </div>

        <div id="save-panel">
          Terdeteksi: <strong id="last-count">0</strong> — Simpan ke riwayat?
          <div class="btn-group">
            <button type="button" id="skipHistoryBtn">Lewati</button>
            <button type="button" id="saveHistoryBtn">💾 Simpan</button>
          </div>
        </div>

        <div class="history-section">
          <div class="history-header">
            <strong>Riwayat Hitungan</strong>
            <button type="button" id="resetHistoryBtn">🧹 Reset</button>
          </div>
          <div id="history-summary">Belum ada perhitungan tersimpan</div>
          <ul id="history-list"></ul>
        </div>
      </div>
    </div>

    <script>
      // --- KONFIGURASI ---
      const MODEL_PATH = "bestqc_v1.2.onnx";
      const INPUT_SIZE = 640;
      const CLASS_NAMES = ["Bawah", "Atas"];
      const CLASS_COLORS = ["#3b82f6", "#f59e0b"];
      const DEFAULT_THRESHOLD = 0.5;
      const ORT_WASM_PATH = "ort/";
      const ORT_WASM_FILE = ORT_WASM_PATH + "ort-wasm.wasm";
      const ORT_WASM_SIMD_FILE = ORT_WASM_PATH + "ort-wasm-simd.wasm";
      const HISTORY_KEY = "btechlens_qc_history";
      const MODEL_VERSION = "v1.2";
      const HISTORY_LIMIT = 50;
      // -------------------

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const imgDisp = document.getElementById("imageDisplay");
      const fileInput = document.getElementById("fileInput");
      const cameraInput = document.getElementById("cameraInput");
      const stopBtn = document.getElementById("stopBtn");
      const status = document.getElementById("status");
      const countBadge = document.getElementById("count-badge");
      const legendEl = document.getElementById("legend");

      let session = null;
      let mode = "idle";
      let lastBoxes = [];
      let pendingSave = null;

      const preprocessCanvas = document.createElement("canvas");
      preprocessCanvas.width = INPUT_SIZE;
      preprocessCanvas.height = INPUT_SIZE;
      const preprocessCtx = preprocessCanvas.getContext("2d", {
        willReadFrequently: true,
      });
      const inputBuffer = new Float32Array(3 * INPUT_SIZE * INPUT_SIZE);

      function renderLegend() {
        legendEl.innerHTML = CLASS_NAMES.map(
          (name, i) =>
            `<span class="legend-item">
              <span class="legend-dot" style="background:${CLASS_COLORS[i]}"></span>
              ${name}: <span class="class-count" id="count-class-${i}">0</span>
            </span>`,
        ).join("");
      }

      function updateCounts(boxes) {
        const perClass = CLASS_NAMES.map(() => 0);
        boxes.forEach((b) => perClass[b.classId]++);
        countBadge.innerText = boxes.length;
        perClass.forEach((n, i) => {
          const el = document.getElementById(`count-class-${i}`);
          if (el) el.innerText = n;
        });
      }

      renderLegend();

      function getHistory() {
        try {
          return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        } catch {
          return [];
        }
      }

      function formatHistoryDate(iso) {
        return new Date(iso).toLocaleString("id-ID", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function buildHistoryEntry(boxes) {
        const perClass = CLASS_NAMES.map(() => 0);
        boxes.forEach((b) => perClass[b.classId]++);
        return {
          id: String(Date.now()),
          date: new Date().toISOString(),
          total: boxes.length,
          perClass: Object.fromEntries(
            CLASS_NAMES.map((name, i) => [name, perClass[i]]),
          ),
          model: MODEL_VERSION,
        };
      }

      function renderHistory() {
        const list = document.getElementById("history-list");
        const summary = document.getElementById("history-summary");
        const history = getHistory();

        if (!history.length) {
          summary.innerHTML = "Belum ada perhitungan tersimpan";
          list.innerHTML = '<li class="history-empty">Belum ada riwayat</li>';
          return;
        }

        const grandTotal = history.reduce((sum, h) => sum + (h.total || 0), 0);
        const perClassTotals = CLASS_NAMES.map((name) => ({
          name,
          count: history.reduce((sum, h) => sum + (h.perClass?.[name] ?? 0), 0),
        }));
        const classSummary = perClassTotals
          .map((c) => `${c.name}: <strong>${c.count}</strong>`)
          .join(" · ");

        summary.innerHTML =
          `Jumlah scan: <strong>${history.length}</strong> · ` +
          `Total akumulasi: <strong>${grandTotal}</strong><br>` +
          classSummary;

        list.innerHTML = history
          .map((h, i) => {
            const detail = CLASS_NAMES.map(
              (n) => `${n}: ${h.perClass?.[n] ?? 0}`,
            ).join(", ");
            return `<li>
              <span class="history-item-text">#${
                history.length - i
              } · ${formatHistoryDate(h.date)} — <strong>${
                h.total
              }</strong> (${detail})</span>
              <button type="button" class="history-delete-btn" data-id="${
                h.id
              }" title="Hapus scan ini">✕</button>
            </li>`;
          })
          .join("");
      }

      function deleteHistoryItem(id) {
        if (!confirm("Yakin hapus scan ini dari riwayat?")) return;
        const history = getHistory().filter((h) => h.id !== id);
        if (history.length === getHistory().length) return;
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        renderHistory();
      }

      function saveToHistory(entry) {
        const history = getHistory();
        history.unshift(entry);
        localStorage.setItem(
          HISTORY_KEY,
          JSON.stringify(history.slice(0, HISTORY_LIMIT)),
        );
        renderHistory();
      }

      function resetHistory() {
        if (!confirm("Hapus semua riwayat hitungan?")) return;
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
      }

      function showSavePanel(boxes) {
        pendingSave = buildHistoryEntry(boxes);
        document.getElementById("last-count").innerText = pendingSave.total;
        document.getElementById("save-panel").style.display = "block";
      }

      function hideSavePanel() {
        pendingSave = null;
        document.getElementById("save-panel").style.display = "none";
      }

      function shouldShowNumbers() {
        const selected = document.querySelector(
          'input[name="showNumbers"]:checked',
        );
        return selected?.value === "on";
      }

      function formatOrtError(e) {
        if (!e) return "Unknown error";
        if (typeof e === "number") return `ONNX runtime error (${e})`;
        return e.message || String(e);
      }

      function configureOrt(useSimd = false) {
        const wasmFile = useSimd ? ORT_WASM_SIMD_FILE : ORT_WASM_FILE;
        ort.env.wasm.numThreads = 1;
        ort.env.wasm.simd = useSimd;
        ort.env.wasm.wasmPaths = {
          "ort-wasm.wasm": wasmFile,
          "ort-wasm-simd.wasm": ORT_WASM_SIMD_FILE,
          "ort-wasm-threaded.wasm": wasmFile,
          "ort-wasm-simd-threaded.wasm": ORT_WASM_SIMD_FILE,
        };
      }

      async function createSession() {
        const response = await fetch(MODEL_PATH);
        if (!response.ok) {
          throw new Error(`Model tidak ditemukan (${response.status})`);
        }
        const modelBuffer = await response.arrayBuffer();
        const attempts = [
          { simd: false, opts: { graphOptimizationLevel: "disabled" } },
          { simd: false, opts: {} },
          { simd: true, opts: { graphOptimizationLevel: "disabled" } },
        ];

        let lastError = null;
        for (const { simd, opts } of attempts) {
          try {
            configureOrt(simd);
            return await ort.InferenceSession.create(modelBuffer.slice(0), {
              executionProviders: ["wasm"],
              ...opts,
            });
          } catch (err) {
            lastError = err;
            console.warn(
              "Percobaan load model gagal:",
              simd ? "simd" : "non-simd",
              err,
            );
          }
        }
        throw lastError;
      }

      // 1. Inisialisasi ONNX Runtime
      async function init() {
        try {
          status.innerText = "⏳ Memuat Model v1.2...";
          configureOrt(false);
          session = await createSession();
          status.innerText = "✅ AI Siap";
          status.title = "";
        } catch (e) {
          const msg = formatOrtError(e);
          status.innerText = "❌ Gagal Load Model";
          status.title = msg;
          console.error("Gagal load model:", e);
        }
      }

      async function runInference(source) {
        const threshold = DEFAULT_THRESHOLD;

        preprocessCtx.drawImage(source, 0, 0, INPUT_SIZE, INPUT_SIZE);
        const imageData = preprocessCtx.getImageData(
          0,
          0,
          INPUT_SIZE,
          INPUT_SIZE,
        );
        const pixels = imageData.data;
        const size = INPUT_SIZE * INPUT_SIZE;

        for (let i = 0; i < size; i++) {
          const p = i * 4;
          inputBuffer[i] = pixels[p] / 255;
          inputBuffer[i + size] = pixels[p + 1] / 255;
          inputBuffer[i + 2 * size] = pixels[p + 2] / 255;
        }

        const tensor = new ort.Tensor("float32", inputBuffer, [
          1,
          3,
          INPUT_SIZE,
          INPUT_SIZE,
        ]);
        const results = await session.run({ images: tensor });
        const output = results[session.outputNames[0]];

        return processOutput(output.data, output.dims, threshold);
      }

      function processOutput(data, dims, threshold) {
        const boxes = [];
        const [_, numProps, numAnchors] = dims;
        const sX = canvas.width / INPUT_SIZE;
        const sY = canvas.height / INPUT_SIZE;

        for (let i = 0; i < numAnchors; i++) {
          let maxConf = 0;
          let classId = 0;
          for (let c = 4; c < numProps; c++) {
            const conf = data[c * numAnchors + i];
            if (conf > maxConf) {
              maxConf = conf;
              classId = c - 4;
            }
          }

          if (maxConf > threshold) {
            const cx = data[0 * numAnchors + i];
            const cy = data[1 * numAnchors + i];
            const w = data[2 * numAnchors + i];
            const h = data[3 * numAnchors + i];

            boxes.push({
              x: (cx - w / 2) * sX,
              y: (cy - h / 2) * sY,
              w: w * sX,
              h: h * sY,
              conf: maxConf,
              classId,
            });
          }
        }
        return nms(boxes, 0.45);
      }

      function draw(boxes, source) {
        lastBoxes = boxes;
        ctx.drawImage(source, 0, 0, canvas.width, canvas.height);

        ctx.lineWidth = Math.max(1, canvas.width / 800);

        const fontSize = Math.max(12, canvas.width / 50);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textBaseline = "top";

        // Penomoran label kotak mulai dari 1 per kelas (bukan urutan global).
        const perClassCounter = CLASS_NAMES.map(() => 0);

        boxes.forEach((b) => {
          const color = CLASS_COLORS[b.classId] || CLASS_COLORS[0];
          ctx.strokeStyle = color;
          ctx.fillStyle = color;

          ctx.strokeRect(b.x, b.y, b.w, b.h);

          if (shouldShowNumbers()) {
            const cls = Number.isFinite(b.classId) ? b.classId : 0;
            const safeCls = cls >= 0 && cls < perClassCounter.length ? cls : 0;

            const txt = (++perClassCounter[safeCls]).toString();
            const txtW = ctx.measureText(txt).width;
            const pad = fontSize * 0.2;

            ctx.fillRect(b.x, b.y, txtW + pad * 2, fontSize + pad * 2);

            ctx.fillStyle = "#ffffff";
            ctx.fillText(txt, b.x + pad, b.y + pad);
          }
        });

        updateCounts(boxes);
      }

      function processImageFile(file) {
        if (!file) return;
        hideSavePanel();
        mode = "image";
        status.innerText = "⏳ Memproses Gambar...";

        stopBtn.style.display = "inline-block";
        fileInput.parentElement.style.display = "none";
        cameraInput.parentElement.style.display = "none";

        const reader = new FileReader();
        reader.onload = (event) => {
          imgDisp.src = event.target.result;
          imgDisp.onload = async () => {
            canvas.width = imgDisp.naturalWidth;
            canvas.height = imgDisp.naturalHeight;
            const boxes = await runInference(imgDisp);
            draw(boxes, imgDisp);
            showSavePanel(boxes);
            status.innerText = "✅ Gambar Terdeteksi";
          };
        };
        reader.readAsDataURL(file);
      }

      // --- HANDLER GALERI (UPLOAD GAMBAR) ---
      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        processImageFile(file);
      };

      cameraInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        processImageFile(file);
      };

      // Handler Tombol Stop
      stopBtn.onclick = () => {
        mode = "idle";
        stopBtn.style.display = "none";
        fileInput.parentElement.style.display = "inline-block";
        cameraInput.parentElement.style.display = "inline-block";
        imgDisp.style.display = "none";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        status.innerText = "✅ AI Siap";
        lastBoxes = [];
        hideSavePanel();
        updateCounts([]);
      };

      document.getElementById("saveHistoryBtn").onclick = () => {
        if (!pendingSave) return;
        saveToHistory(pendingSave);
        hideSavePanel();
        status.innerText = "✅ Tersimpan ke riwayat";
      };

      document.getElementById("skipHistoryBtn").onclick = () => {
        hideSavePanel();
      };

      document.getElementById("resetHistoryBtn").onclick = resetHistory;

      document.getElementById("history-list").onclick = (e) => {
        const btn = e.target.closest(".history-delete-btn");
        if (!btn) return;
        deleteHistoryItem(btn.dataset.id);
      };

      document
        .querySelectorAll('input[name="showNumbers"]')
        .forEach((radio) => {
          radio.onchange = () => {
            if (mode === "image" && imgDisp.src) {
              draw(lastBoxes, imgDisp);
            }
          };
        });

      // Utilitas: NMS (Non-Maximum Suppression) agar kotak tidak tumpuk-tumpuk
      function nms(boxes, iouThresh) {
        boxes.sort((a, b) => b.conf - a.conf); // Urutkan dari conf tertinggi
        const res = [];
        const used = new Set();
        for (let i = 0; i < boxes.length; i++) {
          if (used.has(i)) continue;
          res.push(boxes[i]);
          for (let j = i + 1; j < boxes.length; j++) {
            if (iou(boxes[i], boxes[j]) > iouThresh) used.add(j);
          }
        }
        return res;
      }
      // Hitung Intersection over Union (IoU) antara dua kotak
      function iou(a, b) {
        const x1 = Math.max(a.x, b.x),
          y1 = Math.max(a.y, b.y);
        const x2 = Math.min(a.x + a.w, b.x + b.w),
          y2 = Math.min(a.y + a.h, b.y + b.h);
        const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
        return inter / (a.w * a.h + b.w * b.h - inter);
      }

      renderHistory();
      init();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js")
            .catch((err) => console.warn("Service worker gagal:", err));
        });
      }
    </script>
  </body>
</html>
